<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ECHO 科技手册 · 离线预览</title>
<style>
:root{color-scheme:dark;--bg:#07101b;--panel:#0c1928;--border:#294459;--selected:#173a47;--cyan:#79dedf;--gold:#ddbb86;--text:#e8eff1;--muted:#8a9caa}*{box-sizing:border-box}body{margin:0;background:#030812;color:var(--text);font:16px 'Microsoft YaHei',sans-serif}header{color:var(--muted);padding:12px 24px;font-size:13px}main{height:calc(100vh - 54px);min-height:360px;margin:0 24px 12px;padding:16px 0 0;background:var(--bg);border:1px solid var(--border);display:flex;flex-direction:column}h1{margin:0 18px 22px;font-size:20px;color:var(--cyan);font-weight:400;display:flex;align-items:center;gap:16px}h1 img{image-rendering:pixelated;width:28px;height:28px}.search{display:flex;gap:6px;margin:0 9px 14px}input,button{background:var(--panel);border:1px solid var(--border);color:var(--text);font:inherit}input{height:40px;flex:1;min-width:0;padding:0 12px}input:focus{outline:1px solid var(--cyan)}button{cursor:pointer;padding:8px 14px}button:hover{border-color:var(--cyan)}#help{color:var(--cyan)}.columns{flex:1;min-height:0;display:grid;grid-template-columns:20% 24% 1fr;gap:12px}nav,#entries,article{border:1px solid var(--border);background:var(--panel);overflow:auto;scrollbar-color:var(--border) var(--panel);scrollbar-width:thin}nav button,#entries button{display:block;width:100%;text-align:left;border:0;border-left:3px solid transparent;padding:10px 12px;background:transparent}nav button.active,#entries button.active{color:var(--cyan);background:var(--selected);border-left-color:var(--cyan)}#entries button{padding:9px 12px}small{display:block;font-size:13px;color:var(--muted);margin-top:5px}article{padding:16px;display:flex;flex-direction:column}article h2{font-size:19px;font-weight:400;color:var(--gold);margin:0 0 22px}article p{white-space:pre-wrap;line-height:1.7;margin:0 0 24px}#body{overflow:auto;flex:1}.items{border-top:1px solid var(--border);padding-top:12px;color:var(--muted);font-size:13px}.items button{margin:8px 4px 0 0;font-size:12px;padding:6px;color:var(--cyan)}footer{font-size:13px;color:var(--muted);padding:8px}#toast{position:fixed;bottom:30px;right:30px;background:var(--selected);color:var(--cyan);padding:12px;display:none}.screens{font-size:13px;text-decoration:none;color:var(--muted);margin-left:auto}@media(max-width:780px){header{padding:8px}main{margin:0 8px 8px}.columns{gap:6px;grid-template-columns:24% 26% 1fr}body{font-size:13px}h1{font-size:16px;margin-bottom:12px}article{padding:10px}article h2{font-size:15px}.screens{display:none}}
</style><style>#pictures{margin:0 0 16px}#pictures:empty{display:none}#pictures img{display:block;max-width:100%;max-height:240px;margin:auto;cursor:zoom-in;object-fit:contain}#pictures .caption{color:var(--muted);font-size:12px;margin-top:6px;display:flex;align-items:center;gap:8px}#pictures button{font-size:12px;padding:3px 8px}dialog{border:1px solid var(--border);background:var(--bg);color:var(--text);max-width:95vw;max-height:95vh;padding:12px}dialog::backdrop{background:#000b}dialog img{display:block;max-width:87vw;max-height:78vh;object-fit:contain;margin:12px auto}dialog .bar{display:flex;gap:12px;align-items:center}dialog .bar span{flex:1;color:var(--muted);font-size:13px}</style><style>#control-table:empty{display:none}#control-table{margin-bottom:24px}#control-table h3{color:var(--gold);font-size:16px;font-weight:400}#control-table>div{color:var(--cyan);margin:10px 0}#control-table small{margin:4px 0 0 8px;line-height:1.6}kbd{font:inherit;color:var(--cyan);border:1px solid var(--border);padding:2px 6px}</style><header>离线交互预览 · 生产 UI 与原模组插图 · 键位为本实例参考，游戏内跟随设置 · 游戏中打开 JEI</header><main><h1><img src="tech_manual.png" alt="">ECHO / 科技模组手册<a class="screens" href="20-controls.png" target="_blank">查看共用绘制代码截图 ↗</a></h1><div class="search"><input id="query" placeholder="搜索模组、机器或机制…" aria-label="搜索手册"><button id="clear" aria-label="清空搜索">×</button><button id="help" aria-label="搜索帮助">?</button></div><div class="columns"><nav aria-label="模组目录"></nav><div id="entries" aria-label="条目列表"></div><article><div id="body"><h2></h2><div id="pictures"></div><div id="control-table"></div><p></p></div><div class="items"></div></article></div><footer></footer></main><div id="toast"></div><dialog id="viewer"><div class="bar"><button id="previous" aria-label="上一张">←</button><span id="credit"></span><button id="next" aria-label="下一张">→</button><button id="close-viewer">返回</button></div><img id="large" alt="机器图解"></dialog>
<script type="module">
const data=await fetch('manual.json',{cache:'no-store'}).then(r=>r.json()),q=document.querySelector('#query'),nav=document.querySelector('nav'),list=document.querySelector('#entries'),title=document.querySelector('h2'),body=document.querySelector('article p'),items=document.querySelector('.items');const parameters=new URLSearchParams(location.search),initial=data.entries.find(e=>e.id===parameters.get('entry'));let group=initial?.group||'ae2',selected=initial?.id||'ae2:inscriber',results=[],help=false;
const referenceKeys=await fetch('keybindings.json',{cache:'no-store'}).then(r=>r.ok?r.json():{}).catch(()=>({}));
const controlTable=document.querySelector('#control-table');
function controlText(e){return (e.controls||[]).map(id=>{let k=data.keybinds?.[id];return k?(k.zh+' '+k.en+' '+k.when+' '+k.whenEn):'';}).join(' ');}
function showControls(e){controlTable.replaceChildren();if(!e?.controls?.length)return;let heading=document.createElement('h3');heading.textContent='按键与操作';controlTable.append(heading);for(let id of e.controls){let k=data.keybinds?.[id];if(!k)continue;let row=document.createElement('div'),key=document.createElement('kbd');key.textContent=referenceKeys[id]||'见按键设置';row.append(key,document.createTextNode(' '+k.zh));let note=document.createElement('small');note.textContent=k.when;row.append(note);controlTable.append(row);}}
const names=g=>(g.id+' '+g.zh+' '+g.en+' '+g.mods.join(' ')+' '+(g.search||'')).toLowerCase();
const groups=new Map(data.groups.map(g=>[g.id,g]));
function parse(s){let alternatives=[],terms=[],value='',quoted=false,escaped=false,negative=false;function flush(){if(value)terms.push({value:value.toLowerCase(),negative});value='';negative=false;}for(let c of s+' '){if(escaped){value+=c;escaped=false;continue;}if(c==='\\'){escaped=true;continue;}if(c==='"'){quoted=!quoted;continue;}if(!quoted&&(/\s/.test(c)||c==='|')){flush();if(c==='|'&&terms.length){alternatives.push(terms);terms=[];}continue;}if(!quoted&&!value&&c==='-'){negative=true;continue;}value+=c;}flush();if(terms.length)alternatives.push(terms);return alternatives;}
function matches(e,query){if(!query.length)return true;return query.some(branch=>branch.every(({value:v,negative})=>{let p=v[0],word=v.slice(1),hit=p==='@'?names(groups.get(e.group)).includes(word):p==='&'?e.items.some(id=>id.includes(word)):p==='#'?e.tags.some(t=>t.includes(word)):p==='$'?e.body.toLowerCase().includes(word):(e.zh+' '+e.en+' '+e.body+' '+e.bodyEn+' '+controlText(e)+' '+e.items.join(' ')+' '+names(groups.get(e.group))).toLowerCase().includes(v);return negative?!hit:hit;}));}
function button(label,active,action){let b=document.createElement('button');b.textContent=label;if(active)b.className='active';b.onclick=action;return b;}
function render(){let query=parse(q.value);results=data.entries.filter(e=>(!group||e.group===group)&&matches(e,query));nav.replaceChildren(button('全部内容',group==='',()=>{group='';selected='';help=false;render();}));for(let g of data.groups)nav.append(button(g.zh,group===g.id,()=>{group=g.id;selected='';help=false;render();}));if(!results.some(e=>e.id===selected))selected=results[0]?.id||'';list.replaceChildren();for(let e of results){let b=button(e.zh,e.id===selected,()=>{selected=e.id;help=false;renderArticle();for(let node of list.children)node.classList.toggle('active',node.dataset.id===selected);});b.dataset.id=e.id;let label=document.createElement('small');label.textContent=(e.guide?'机制 · ':'物品 · ')+groups.get(e.group).zh;b.append(label);list.append(b);}renderArticle();document.querySelector('footer').textContent=`收录 ${data.groups.length} 个分类 / ${results.length} 个结果`;}
let currentPictures=[],pictureIndex=0;const pictureArea=document.querySelector('#pictures'),viewer=document.querySelector('#viewer');
function displayLarge(){let p=data.pictures[currentPictures[pictureIndex]];document.querySelector('#large').src=p.preview;document.querySelector('#credit').textContent=`${pictureIndex+1}/${currentPictures.length} · ${p.credit}`;}
function renderPicture(){pictureArea.replaceChildren();if(!currentPictures.length)return;let p=data.pictures[currentPictures[pictureIndex]],img=document.createElement('img');img.src=p.preview;img.alt=p.caption||'机器操作图解';img.onclick=()=>{displayLarge();viewer.showModal();};pictureArea.append(img);let caption=document.createElement('div');caption.className='caption';caption.textContent=p.credit+' · 点击放大';if(currentPictures.length>1)caption.append(button('←',false,()=>{pictureIndex=(pictureIndex+currentPictures.length-1)%currentPictures.length;renderPicture();}),document.createTextNode(`${pictureIndex+1}/${currentPictures.length}`),button('→',false,()=>{pictureIndex=(pictureIndex+1)%currentPictures.length;renderPicture();}));pictureArea.append(caption);}
document.querySelector('#previous').onclick=()=>{pictureIndex=(pictureIndex+currentPictures.length-1)%currentPictures.length;displayLarge();};document.querySelector('#next').onclick=()=>{pictureIndex=(pictureIndex+1)%currentPictures.length;displayLarge();};document.querySelector('#close-viewer').onclick=()=>viewer.close();
function renderArticle(){showControls(null);items.replaceChildren();pictureArea.replaceChildren();currentPictures=[];pictureIndex=0;document.querySelector('#body').scrollTop=0;if(help){title.textContent='搜索方法';body.textContent='普通文字：名称与操作说明\n@ae2：本体与附属\n#c:ingots：物品标签\n&mekanism:：物品 ID\n空格：同时满足；|：任意满足；-词语：排除\n"合成 CPU"：短语\n\n游戏内还支持真实物品提示 $、JEI 颜色 ^ 与创造标签页 %；颜色/标签页遵循 JEI 配置。\n物品左键/R：配方；右键/U：用途。';return;}let e=results.find(e=>e.id===selected);title.textContent=e?.zh||'没有找到条目';body.textContent=e?.body||'缩短关键词、清空搜索，或选择全部内容。';if(e){showControls(e);currentPictures=e.pictures||[];renderPicture();items.textContent='相关物品 · 游戏中打开 JEI';for(let id of e.items.slice(0,8)){let b=button(data.entries.find(item=>item.id===id)?.zh||e.zh,false,()=>{let toast=document.querySelector('#toast');toast.textContent='游戏中点击物品可打开 JEI 配方';toast.style.display='block';setTimeout(()=>toast.style.display='none',2200);});b.title=id;items.append(b);}}}
q.oninput=()=>{group='';selected='';help=false;render();};q.oncontextmenu=e=>{e.preventDefault();q.value='';q.oninput();};document.querySelector('#clear').onclick=()=>{q.value='';q.oninput();q.focus();};document.querySelector('#help').onclick=()=>{help=!help;renderArticle();};document.addEventListener('keydown',e=>{if(e.ctrlKey&&e.key==='f'){e.preventDefault();q.focus();}});render();
</script></html>
