name: Withdraw requested v0.1.2 release
on:
  push:
    branches: [main]
    paths: [.github/workflows/withdraw-v012.yml]
permissions:
  contents: write
jobs:
  withdraw:
    runs-on: ubuntu-latest
    steps:
      - name: Back up release metadata and verify scope
        id: backup
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (context.repo.owner !== 'RainRaf-UwU' || context.repo.repo !== 'Path-Of-Creation') throw new Error('Unexpected repository');
            const [obsolete, previous] = await Promise.all([
              github.rest.repos.getReleaseByTag({...context.repo, tag: 'v0.1.2'}),
              github.rest.repos.getReleaseByTag({...context.repo, tag: 'v0.1.1'})
            ]);
            if (obsolete.data.tag_name !== 'v0.1.2' || previous.data.tag_name !== 'v0.1.1' || previous.data.draft || previous.data.prerelease) throw new Error('Unexpected release state');
            fs.writeFileSync('withdrawn-v012.json', JSON.stringify(obsolete.data, null, 2));
            core.setOutput('obsolete_id', obsolete.data.id);
            core.setOutput('previous_id', previous.data.id);
      - uses: actions/upload-artifact@v4
        with:
          name: withdrawn-v012-metadata
          path: withdrawn-v012.json
          retention-days: 90
      - name: Withdraw only v0.1.2 and restore Latest
        uses: actions/github-script@v7
        with:
          script: |
            const obsoleteId = Number('${{ steps.backup.outputs.obsolete_id }}');
            const previousId = Number('${{ steps.backup.outputs.previous_id }}');
            if (!Number.isSafeInteger(obsoleteId) || !Number.isSafeInteger(previousId) || obsoleteId === previousId) throw new Error('Invalid release IDs');
            await github.rest.repos.updateRelease({...context.repo, release_id: previousId, make_latest: 'true'});
            await github.rest.repos.deleteRelease({...context.repo, release_id: obsoleteId});
            try {
              await github.rest.repos.getReleaseByTag({...context.repo, tag: 'v0.1.2'});
              throw new Error('v0.1.2 release still exists');
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const latest = await github.rest.repos.getLatestRelease(context.repo);
            if (latest.data.tag_name !== 'v0.1.1') throw new Error('Unexpected Latest release');
            core.info('Verified: v0.1.2 release is absent; v0.1.1 is Latest; Git tag and commit history preserved.');
