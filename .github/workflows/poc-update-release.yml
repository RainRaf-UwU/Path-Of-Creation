name: Build client update package

on:
  release:
    types: [published]
  push:
    tags: ['v[0-9]*']

permissions:
  contents: write

concurrency:
  group: poc-update-release
  cancel-in-progress: false

jobs:
  package:
    if: ${{ github.event_name == 'push' || (!github.event.release.prerelease && !github.event.release.draft) }}
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read release notes
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let notes;
            if (context.eventName === 'push') {
              const pack = JSON.parse(fs.readFileSync('config/poc-updater/pack.json', 'utf8'));
              if (process.env.RELEASE_TAG !== `v${pack.version}`) {
                throw new Error('Release tag must match config/poc-updater/pack.json');
              }
              notes = pack.changelog || '';
            } else {
              notes = context.payload.release.body || '';
            }
            fs.writeFileSync('release-notes.txt', notes, 'utf8');
      - name: Select published delta bases
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const target = process.env.RELEASE_TAG.replace(/^v/i, '');
            const compare = (a, b) => {
              const x = a.replace(/^v/i, '').split('.').map(BigInt);
              const y = b.replace(/^v/i, '').split('.').map(BigInt);
              for (let i = 0; i < Math.max(x.length, y.length); i++) {
                if ((x[i] || 0n) !== (y[i] || 0n)) return (x[i] || 0n) > (y[i] || 0n) ? 1 : -1;
              }
              return 0;
            };
            const releases = await github.rest.repos.listReleases({ ...context.repo, per_page: 100 });
            const bases = releases.data.filter(r => !r.draft && !r.prerelease
              && /^v\d+(?:\.\d+){1,3}$/i.test(r.tag_name) && compare(r.tag_name, target) < 0)
              .sort((a, b) => compare(b.tag_name, a.tag_name)).slice(0, 3);
            fs.mkdirSync('dist/delta-bases', { recursive: true });
            const pack = JSON.parse(fs.readFileSync('config/poc-updater/pack.json', 'utf8'));
            for (const release of bases) {
              try {
                let bytes;
                const asset = release.assets.find(a => a.name === 'poc-update.json');
                if (asset) {
                  const prefix = `https://github.com/${context.repo.owner}/${context.repo.repo}/releases/download/`;
                  if (asset.size > 8 * 1024 * 1024 || !asset.browser_download_url.startsWith(prefix)) throw new Error('Invalid manifest asset');
                  const response = await fetch(asset.browser_download_url, { signal: AbortSignal.timeout(30000) });
                  if (!response.ok) throw new Error(`Manifest HTTP ${response.status}`);
                  bytes = Buffer.from(await response.arrayBuffer());
                } else {
                  // Older releases did not publish the final manifest as an attachment.
                  const result = await github.rest.repos.getContent({ ...context.repo,
                    path: 'config/poc-updater/baseline.json', ref: release.tag_name });
                  if (result.data.type !== 'file' || result.data.size > 8 * 1024 * 1024) throw new Error('Invalid legacy baseline');
                  bytes = Buffer.from(result.data.content, 'base64');
                }
                if (bytes.length > 8 * 1024 * 1024) throw new Error('Manifest too large');
                const base = JSON.parse(bytes.toString('utf8'));
                if (compare(base.version, release.tag_name) !== 0) throw new Error('Base version does not match release');
                if (base.minecraft !== pack.minecraft || base.neoforge !== pack.neoforge) continue;
                fs.writeFileSync(`dist/delta-bases/${release.tag_name}.json`, bytes);
              } catch (error) {
                core.warning(`Skipping delta base ${release.tag_name}: ${error.message}`);
              }
            }
      - name: Package managed modpack files
        run: python tools/poc-updater/package_release.py --version "$RELEASE_TAG" --notes-file release-notes.txt --output dist/poc-updater --bases-dir dist/delta-bases
      - name: Create draft release from tag
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Path of Creation 创世之径 $RELEASE_TAG" --notes-file release-notes.txt
          fi
      - name: Attach update package, checksum and logos
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mapfile -t names < dist/poc-updater/assets.txt
          assets=()
          for name in "${names[@]}"; do assets+=("dist/poc-updater/$name"); done
          gh release upload "$RELEASE_TAG" "${assets[@]}" design/branding/path-of-creation-icon-256-v2.png design/branding/path-of-creation-logo-v2.png --clobber
      - name: Publish release from tag
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
      - name: Publish static version feed
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const branch = 'main';
            const path = 'config/poc-updater/latest.json';
            const repo = context.repo;
            const data = fs.readFileSync('dist/poc-updater/latest.json');
            const next = JSON.parse(data.toString('utf8'));
            let sha;
            try {
              const existing = await github.rest.repos.getContent({ ...repo, path, ref: branch });
              sha = existing.data.sha;
              const previous = JSON.parse(Buffer.from(existing.data.content, 'base64').toString('utf8'));
              const a = previous.version.split('.').map(BigInt);
              const b = next.version.split('.').map(BigInt);
              let order = 0;
              for (let i = 0; i < Math.max(a.length, b.length); i++) {
                const x = a[i] || 0n, y = b[i] || 0n;
                if (x !== y) { order = x > y ? 1 : -1; break; }
              }
              if (order > 0) { core.info('Keeping the newer published version'); return; }
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({ ...repo, branch, path, sha,
              message: 'new commit', content: data.toString('base64') });
